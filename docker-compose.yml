services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-a:
    build:
      context: .
      dockerfile: src/HybridCacheRedisTags.Sample/Dockerfile
    environment:
      Redis__ConnectionString: redis:6379
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy

  app-b:
    build:
      context: .
      dockerfile: src/HybridCacheRedisTags.Sample/Dockerfile
    environment:
      Redis__ConnectionString: redis:6379
    ports:
      - "8082:8080"
    depends_on:
      redis:
        condition: service_healthy
